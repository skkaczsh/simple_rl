schema_version: training_config.v0
phase: phase_1a
task: standing_tuned
description: "Phase 1-A standing with domain randomization and tuned hyperparameters"

env:
  env_id: physics_mock_env_v0
  dt_s: 0.02
  horizon_steps: 500
  action_scale: 0.25
  decimation: 1

command:
  vx_range: [0.0, 0.0]
  vy_range: [0.0, 0.0]
  yaw_rate_range: [0.0, 0.0]
  height_range: [0.71, 0.77]

physics:
  gravity_m_s2: -9.81
  base_mass_kg: 30.0
  joint_stiffness: 50.0
  joint_damping: 5.0
  ground_friction: 0.8
  action_noise_std: 0.01
  domain_randomization:
    friction_range: [0.6, 1.2]
    stiffness_scale_range: [0.85, 1.15]
    damping_scale_range: [0.8, 1.2]
    mass_scale_range: [0.9, 1.1]
    latency_steps_range: [0, 2]

reward:
  config_path: configs/rewards/phase1_locomotion_rewards.yaml

termination:
  base_height_min_m: 0.45
  roll_max_rad: 0.8
  pitch_max_rad: 0.8

training:
  algorithm: ppo
  num_envs: 4
  num_iterations: 200
  batch_size: 256
  mini_batch_size: 64
  learning_rate: 1.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  clip_range_vf: 0.2
  entropy_coef: 0.02
  value_loss_coef: 1.0
  max_grad_norm: 0.5
  save_interval: 20
  eval_interval: 20
  log_interval: 5

seed: 42
